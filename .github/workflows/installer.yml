# Baut bei jedem veröffentlichten Release die Installer und hängt sie an das Release:
#   Linux: drei Doppelklick-Installer (.desktop) + Installationsskript
#   Windows: <APP_ID>-setup.exe (Inno Setup)
# Gesteuert über installer.conf. Diese Datei muss nicht angepasst werden.
name: Installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release-Tag, z. B. v1.0.1"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  GH_TOKEN: ${{ github.token }}

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer erzeugen
        run: python3 vorlage/erzeugen.py linux "${{ github.repository }}" "$TAG"
      - name: Prüfen
        run: |
          shopt -s nullglob
          for f in ausgabe/*.sh; do bash -n "$f"; done
          ls -l ausgabe
      - name: An das Release hängen
        run: |
          shopt -s nullglob
          files=(ausgabe/*.sh ausgabe/*.desktop)
          [ ${#files[@]} -eq 0 ] || gh release upload "$TAG" "${files[@]}" --clobber --repo "${{ github.repository }}"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup-Skript erzeugen
        shell: bash
        run: python vorlage/erzeugen.py windows "${{ github.repository }}" "$TAG"
      - name: Programmdatei aus dem Release holen
        shell: bash
        run: |
          [ -f ausgabe/setup.iss ] || { echo "Kein Windows-Setup gewünscht"; exit 0; }
          file=$(tr -d '\r' < ausgabe/setup.iss | sed -n 's/^#define AppExe "\(.*\)"$/\1/p')
          mkdir -p ausgabe/programm
          # Wird die Datei erst von einem anderen Workflow hochgeladen, bis zu 10 Minuten warten
          for i in $(seq 1 40); do
            gh release download "$TAG" -p "$file" -D ausgabe/programm --clobber --repo "${{ github.repository }}" && break
            echo "warte auf $file im Release …"; sleep 15
          done
          [ -f "ausgabe/programm/$file" ] || { echo "$file fehlt im Release $TAG"; exit 1; }
      - name: Setup bauen
        shell: pwsh
        run: |
          if (-not (Test-Path ausgabe\setup.iss)) { exit 0 }
          choco install innosetup -y --no-progress
          iscc ausgabe\setup.iss
      - name: Setup prüfen (still installieren und wieder entfernen)
        shell: pwsh
        run: |
          $setup = Get-ChildItem ausgabe\ausgabe\*-setup.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) { exit 0 }
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Setup: Exitcode $($p.ExitCode)" }
          $uninst = Get-ChildItem "$env:LOCALAPPDATA\Programs\*\unins000.exe" | Select-Object -First 1
          if (-not $uninst) { throw "Setup hat nichts installiert" }
          $u = Start-Process $uninst.FullName -ArgumentList "/VERYSILENT" -PassThru -Wait
          if ($u.ExitCode -ne 0) { throw "Deinstallation: Exitcode $($u.ExitCode)" }
      - name: An das Release hängen
        shell: bash
        run: |
          shopt -s nullglob
          files=(ausgabe/ausgabe/*-setup.exe)
          [ ${#files[@]} -eq 0 ] || gh release upload "$TAG" "${files[@]}" --clobber --repo "${{ github.repository }}"
