# ===== Einstellungen für die Installer – nur diese Datei anpassen =====
# Bei jedem GitHub-Release baut der Workflow daraus automatisch:
#   - Linux: drei Doppelklick-Installer (.desktop) und das Installationsskript
#   - Windows: eine setup.exe (wenn WINDOWS_FILE gesetzt ist)
# und hängt alles an das Release.

# Name, wie er im Startmenü / Anwendungsmenü erscheint
APP_NAME="Beispielprogramm"

# Kurzname ohne Leerzeichen (Ordner- und Menüname)
APP_ID="beispielprogramm"

# Kurze Beschreibung für den Menüeintrag
APP_COMMENT="Zeigt, wie die Doppelklick-Installer funktionieren"

# --- Linux ---
# Datei im Release, die auf Linux installiert wird (fertiges Programm, AppImage, Skript …)
LINUX_FILE="beispiel.sh"
# Wie sie gestartet wird. {file} = Pfad der installierten Datei. Leer = Datei direkt starten.
# Beispiele: "python3 {file}"   "bash {file}"
LINUX_RUN="bash {file}"
# Pakete, die zusätzlich installiert werden (leer lassen, wenn keine nötig sind)
PKGS_ARCH=""        # Arch / CachyOS / Manjaro (pacman)
PKGS_DEB=""         # Debian / Ubuntu (apt)
PKGS_RPM=""         # Fedora (dnf)
PKGS_SUSE=""        # openSUSE (zypper)
# Befehle, die einmalig mit Administratorrechten laufen (z. B. Dienst einschalten). Leer = keine.
ROOT_CMDS=""

# --- Windows ---
# Datei im Release, die das Setup installiert (z. B. MeinProgramm.exe). Leer = kein Windows-Setup.
WINDOWS_FILE="beispiel.cmd"

# --- Symbol (optional) ---
# PNG im Repo für das Linux-Menü, ICO im Repo für Windows. Leer = Standardsymbol.
ICON_PNG=""
ICON_ICO=""
