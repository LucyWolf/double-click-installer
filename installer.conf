# ===== Installer settings – the only file you need to edit =====
# On every GitHub release the workflow builds from this file and attaches to the release:
#   - Linux: three double-click installers (.desktop) and the install script
#   - Windows: a setup.exe
#
# Every setting can be switched on and off:
#   without "#" in front  = on
#   with    "#" in front  = off (the default in brackets applies)

# Name shown in the start menu / application menu (required)
APP_NAME="Example App"

# Short name without spaces, used for folders and the menu entry (required)
APP_ID="example-app"

# Short description for the menu entry
APP_COMMENT="Shows how the double-click installers work"

# Version number shown in the installers and in Windows "Apps".
# Off = taken from the release tag (v1.2.3 -> 1.2.3)
#VERSION="1.0.0"

# --- Linux ---  (comment out LINUX_FILE to build no Linux installers)
# File in the release that is installed on Linux (program, AppImage, script …)
LINUX_FILE="hello.sh"
# How it is started. {file} = path of the installed file. Off = run the file directly.
LINUX_RUN="bash {file}"
# Additional packages per distribution. Off = none.
#PKGS_ARCH="python python-pyqt6"
#PKGS_DEB="python3 python3-pyqt6"
#PKGS_RPM="python3 python3-pyqt6"
#PKGS_SUSE="python3 python3-PyQt6"
# Commands run once with administrator rights (e.g. enable a service). Off = none.
#ROOT_CMDS="systemctl enable --now cups"

# --- Windows ---  (comment out WINDOWS_FILE to build no setup.exe)
# File in the release that the setup installs (e.g. MyApp.exe)
WINDOWS_FILE="hello.cmd"

# --- Icon ---  Off = default icon
# PNG in the repository for the Linux menu, ICO in the repository for Windows
#ICON_PNG="icon.png"
#ICON_ICO="icon.ico"
